<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2F5D50">
<title>내업무 일정관리</title>
<style>
:root{--green:#2F5D50;--gold:#C9A227;--ink:#27364b;--muted:#657084;--line:#dce1e7;--paper:#fff;--bg:#f5f6f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,'Malgun Gothic',sans-serif}button,input,select,textarea{font:inherit}button,input,select{min-height:48px}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:9px 16px;background:#fff;color:var(--green);font-weight:650}button:hover{background:#edf0f5}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:3px}header{background:var(--green);color:#fff;padding:36px 24px 32px}header .inner{max-width:1240px;margin:auto}.eyebrow{letter-spacing:.13em;font-size:16px;color:#e2e7ef}h1{font-size:clamp(28px,5vw,40px);line-height:1.3;margin:10px 0 12px}header p{margin:0;color:#e2e7ef}.topline{display:flex;justify-content:space-between;align-items:center;gap:20px}.date-pill{border:1px solid #ffffff50;border-radius:12px;padding:10px 16px;white-space:nowrap}main{max-width:1288px;margin:auto;padding:28px 24px 40px}.summary{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap}.summary span{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 16px}.summary b{color:var(--green);margin-left:8px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}.schedule{min-width:0}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}.editor{position:sticky;top:20px}h2{font-size:21px;margin:0 0 18px}.editor h2:before{content:'＋';color:var(--gold);margin-right:8px}.field{margin:0 0 16px}label{display:block;font-weight:650;margin-bottom:7px}.optional,.hint{font-weight:400;color:var(--muted);font-size:16px}input:not([type=checkbox]),select,textarea{width:100%;border:1px solid #bac3ce;border-radius:9px;padding:10px 12px;background:#fff;color:var(--ink)}textarea{resize:vertical;min-height:100px}.primary{background:var(--green);border-color:var(--green);color:#fff}.primary:hover{background:#254b40}.form-actions{display:flex;gap:8px}.form-actions .primary{flex:1}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;background:#e6ede7;padding:5px;border-radius:13px;margin-bottom:20px}.tabs button{border:0;background:transparent;padding:9px 4px}.tabs button[aria-selected=true]{color:#fff;background:var(--green);box-shadow:0 2px 5px #26344b20}.view-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}.view-head h2{margin:0}.week-nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.week-nav button{padding:8px 12px}.range{color:var(--muted);margin:8px 0 18px}.week-grid{display:grid;grid-template-columns:repeat(7,minmax(180px,1fr));gap:10px;align-items:stretch;overflow-x:auto;padding-bottom:12px}.day-column{background:#eef3ef;border:1px solid var(--line);border-radius:12px;min-height:260px;padding:8px;min-width:0}.day-column.is-today{background:#f7f4e6;border-color:var(--gold)}.day-title{font-size:16px;text-align:center;padding:5px 0 12px;margin:0;font-weight:700}.day-title small{display:block;font-size:16px;font-weight:400}.weekend .day-title{color:#9d4d35}.list{display:grid;gap:12px}.event{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;overflow-wrap:anywhere}.event.high{border-left:4px solid var(--gold);background:#fffcf0}.event.done .event-title{text-decoration:line-through;color:var(--muted)}.event.done{background:#f5f6f2}.event-title{font-size:18px;line-height:1.45;font-weight:750;margin:8px 0}.event-date{font-size:16px;color:var(--muted)}.badges{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.badge{font-size:16px;border-radius:6px;background:#eef3ef;padding:1px 7px;color:var(--green)}.badge.urgent{background:#f6e8b3;color:#9a3b22;font-weight:750}.badge.dday{color:#9a3b22;background:#f7f0d9}.memo{color:var(--muted);font-size:16px;white-space:pre-wrap;margin:10px 0}.event-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:12px;padding-top:9px}.check-label{display:flex;align-items:center;gap:6px;margin:0 auto 0 0;min-height:48px;font-weight:500;cursor:pointer}.check-label input{width:22px;height:22px;accent-color:var(--green);margin:0}.event-actions button{font-size:16px;padding:7px 10px}.delete{color:#a23d31}.week-grid .event{padding:10px;margin-bottom:8px}.week-grid .event-title{font-size:16px}.week-grid .event-actions{gap:4px}.week-grid .event-actions button{padding:7px 5px;flex:1}.week-grid .check-label{width:100%}.empty{color:var(--muted);text-align:center;padding:34px 12px;border:1px dashed #c8ced8;border-radius:12px;background:#fff}.day-empty{color:var(--muted);text-align:center;font-size:16px;margin:12px 0}.notice{padding:12px 16px;margin:0 0 20px;border:1px solid #d29369;border-radius:10px;background:#fff1df;color:#783e21}footer{max-width:1240px;margin:0 auto;padding:24px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:16px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);padding:12px 20px;background:var(--green);color:#fff;border-radius:12px;z-index:20;box-shadow:0 6px 24px #0002}.hidden,[hidden]{display:none!important}.mobile-add{display:none}.hint{margin:10px 0 0}.required{color:#a3432e}dialog{border:1px solid var(--line);border-radius:16px;padding:24px;max-width:calc(100% - 32px);width:420px;color:var(--ink)}dialog::backdrop{background:#17243b70}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
@media(min-width:1400px){main{max-width:1500px}.workspace{grid-template-columns:minmax(0,1fr) 330px}header .inner{max-width:1452px}}
@media(max-width:1100px){.workspace{grid-template-columns:minmax(0,1fr)}.editor{position:static}.week-grid .event-actions{flex-wrap:wrap}.week-grid .event-actions button{width:100%}.mobile-add{display:block}.editor{max-width:none}}
@media(max-width:700px){header{padding:26px 18px}.topline{display:block}.date-pill{display:inline-block;margin-top:16px}main{padding:20px 14px 28px}.panel{padding:16px}.summary{gap:8px}.summary span{padding:8px 12px;flex:1;white-space:normal}.week-grid{grid-template-columns:1fr;gap:12px}.day-column{min-height:90px;padding:12px}.day-title{text-align:left;border-bottom:1px solid var(--line);margin-bottom:10px;display:flex;gap:8px}.day-title small{display:inline}.week-grid .event{padding:14px}.week-grid .event-actions button{width:auto;flex:0;padding:8px 13px}.week-grid .check-label{width:auto}.tabs{position:sticky;top:0;z-index:5}.event-actions button{padding:8px 13px}.view-head{align-items:flex-start}footer{text-align:left;padding:22px 18px}.week-nav button{padding:8px 10px}}
.header-tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
@media(max-width:700px){.header-tools{margin-top:16px}.header-tools .date-pill{margin-top:0}}

:root{--ink:#243c34;--muted:#596c62;--line:#d9e2da}
header{border-bottom:5px solid var(--gold)}
.eyebrow,header p{color:#edf3e9}.event.high{border-left-width:5px}
.badge.urgent{color:#655013}.badge.dday{color:#655013}.day-column.is-today{box-shadow:inset 0 3px 0 var(--gold)}
.panel{box-shadow:0 6px 24px #243c3406}.weekend .day-title{color:#805c29}
button{touch-action:manipulation;min-width:48px}input[type=date]{min-width:0}
@media(max-width:700px){.summary span{flex:1 1 120px}.event-actions{gap:10px}.week-grid{overflow:visible}.workspace{gap:24px}.tabs button{font-size:16px}.date-pill{white-space:normal}}
</style>
</head>
<body>
<header><div class="inner"><div class="eyebrow">DASAN ARCHITECTS · MY PLANNER</div><div class="topline"><div><h1>내업무 일정관리</h1><p>유한회사 다산건축사사무소 · 건축사 / 공공건축가</p></div><div class="header-tools"><div class="date-pill" id="todayDate"></div></div></div></div></header>
<main>

<div id="storageNotice" class="notice" role="alert" hidden></div>
<div class="summary" id="summary"></div>
<div class="workspace">
<section class="schedule" aria-label="일정 보기">
<div class="tabs" role="tablist" aria-label="일정 보기 선택"><button type="button" role="tab" id="tab-today" data-tab="today" aria-controls="view" aria-selected="false" tabindex="-1">오늘</button><button type="button" role="tab" id="tab-week" data-tab="week" aria-controls="view" aria-selected="true">이번 주</button><button type="button" role="tab" id="tab-past" data-tab="past" aria-controls="view" aria-selected="false" tabindex="-1">지난 일정</button><button type="button" role="tab" id="tab-all" data-tab="all" aria-controls="view" aria-selected="false" tabindex="-1">전체</button></div>
<div class="view-head"><h2 id="viewTitle">오늘 일정</h2><button class="mobile-add" type="button" id="jumpAdd">＋ 일정 입력</button></div>
<div id="weekControls"><div class="week-nav"><button type="button" id="prevWeek" aria-label="이전 주 보기">← 이전 주</button><button type="button" id="thisWeek">이번 주</button><button type="button" id="nextWeek" aria-label="다음 주 보기">다음 주 →</button></div><p class="range" id="weekRange"></p></div>
<div id="view" role="tabpanel" aria-labelledby="tab-week"></div>
</section>
<aside class="panel editor" id="editor"><h2 id="formTitle">새 일정 입력</h2><form id="eventForm">
<div class="field"><label for="title">제목 <span class="required">*</span></label><input id="title" name="title" required maxlength="120" placeholder="어떤 일정인가요?"></div>
<div class="field"><label for="date">날짜 <span class="required">*</span></label><input id="date" name="date" type="date" required min="1900-01-01" max="9999-12-31"></div>
<div class="field"><label for="endDate">종료일 <span class="optional">· 여러 날 일정만 선택</span></label><input id="endDate" name="endDate" type="date" min="1900-01-01" max="9999-12-31"></div>
<div class="field"><label for="category">분류 <span class="required">*</span></label><select id="category" name="category"><option>내일상</option></select></div>
<div class="field"><label for="priority">중요도</label><select id="priority" name="priority"><option value="높음">높음</option><option value="보통" selected>보통</option><option value="낮음">낮음</option></select></div>
<div class="field"><label for="memo">메모 <span class="optional">· 선택</span></label><textarea id="memo" name="memo" maxlength="2000" placeholder="준비물과 확인할 내용을 적어 주세요."></textarea></div>
<div class="form-actions"><button class="primary" id="saveButton" type="submit">일정 저장</button><button id="cancelEdit" type="button" hidden>수정 취소</button></div>
<p class="hint">개인정보 없이 업무 내용 위주로 적어 주세요.</p>
</form></aside></div></main>
<footer>일정은 이 기기의 이 브라우저에만 저장됩니다. 고객 · 환자 · 학생의 실명이나 연락처는 적지 마세요.</footer>
<div class="toast" role="status" id="toast" hidden></div>
<dialog id="deleteDialog" aria-labelledby="deleteHeading"><h2 id="deleteHeading">일정을 삭제할까요?</h2><p id="deleteName"></p><p>삭제한 일정은 복구할 수 없습니다.</p><div class="dialog-actions"><button type="button" id="cancelDelete">취소</button><button type="button" class="primary" id="confirmDelete">삭제</button></div></dialog>

<script>
'use strict';
const STORAGE_KEY='dasan-my-daily-planner-2026-v1';
const categories=['내일상'];
const priorities=['높음','보통','낮음'];
const weekdays=['일','월','화','수','목','금','토'];
const $=id=>document.getElementById(id);
function dateKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function todayKey(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
function parseDate(key){const [y,m,d]=key.split('-').map(Number);const value=new Date(0);value.setFullYear(y,m-1,d);value.setHours(12,0,0,0);return value;}
function dayNumber(key){const [y,m,d]=key.split('-').map(Number);const value=new Date(0);value.setUTCFullYear(y,m-1,d);value.setUTCHours(0,0,0,0);return value.getTime()/86400000;}
function addDays(key,n){const d=parseDate(key);d.setDate(d.getDate()+n);return dateKey(d);}
function monday(key){const d=parseDate(key);return addDays(key,-((d.getDay()+6)%7));}
function formatDate(key,year=false){const d=parseDate(key);return (year?d.getFullYear()+'/':'')+(d.getMonth()+1)+'/'+d.getDate()+'('+weekdays[d.getDay()]+')';}
function dday(event,today=todayKey()){const start=dayNumber(event.date)-dayNumber(today),end=dayNumber(event.endDate)-dayNumber(today);if(start>0)return 'D-'+start;if(end<0)return Math.abs(end)+'일 지남';if(start===0)return 'D-Day';if(event.date!==event.endDate)return '진행 중';return 'D-Day';}
function escapeHTML(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function validDate(value){return typeof value==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(value)&&value>='1900-01-01'&&dateKey(parseDate(value))===value;}
function validEvent(e){return e&&typeof e.id==='string'&&typeof e.title==='string'&&e.title.trim()&&validDate(e.date)&&validDate(e.endDate)&&e.endDate>=e.date&&categories.includes(e.category)&&priorities.includes(e.priority)&&typeof e.memo==='string'&&typeof e.done==='boolean';}
function seedEvents(){return [
{id:'sample-1',title:'ai교육',date:'2026-11-19',endDate:'2026-11-19',category:'내일상',priority:'보통',memo:'예시 일정 · 수정하거나 삭제할 수 있습니다.',done:false},
{id:'sample-2',title:'목포노회 우리교회',date:'2026-11-20',endDate:'2026-11-20',category:'내일상',priority:'보통',memo:'예시 일정 · 수정하거나 삭제할 수 있습니다.',done:false},
{id:'sample-3',title:'김성현 이하은결혼',date:'2026-11-24',endDate:'2026-11-24',category:'내일상',priority:'보통',memo:'예시 일정 · 수정하거나 삭제할 수 있습니다.',done:false},
{id:'sample-4',title:'양제골',date:'2026-11-20',endDate:'2026-11-20',category:'내일상',priority:'보통',memo:'예시 일정 · 수정하거나 삭제할 수 있습니다.',done:false},
{id:'sample-5',title:'제주골프',date:'2026-10-31',endDate:'2026-11-02',category:'내일상',priority:'보통',memo:'예시 일정 · 수정하거나 삭제할 수 있습니다.',done:false}
];}
let storageBlocked=false;
function storageWarning(message){$('storageNotice').textContent=message;$('storageNotice').hidden=false;}
function loadEvents(){try{const raw=localStorage.getItem(STORAGE_KEY);if(raw===null){const initial=seedEvents();localStorage.setItem(STORAGE_KEY,JSON.stringify(initial));return initial;}const parsed=JSON.parse(raw);if(!Array.isArray(parsed)||!parsed.every(validEvent)||new Set(parsed.map(e=>e.id)).size!==parsed.length)throw new Error('invalid data');return parsed;}catch(error){storageBlocked=true;storageWarning('브라우저 저장소를 읽거나 사용할 수 없습니다. 기존 자료 보호를 위해 저장을 중지했습니다. 브라우저의 저장 설정을 확인해 주세요. 현재 변경 내용은 새로고침하면 사라집니다.');return seedEvents();}}
let events=loadEvents(),activeTab='today',weekStart=monday(todayKey()),editingId=null,pendingDelete=null,deleteOpener=null,toastTimer;
function saveEvents(){if(storageBlocked)return false;try{localStorage.setItem(STORAGE_KEY,JSON.stringify(events));return true;}catch(error){storageWarning('저장 공간이 부족하거나 저장이 차단되었습니다. 현재 변경 내용은 새로고침하면 사라질 수 있습니다.');return false;}}
function notify(message){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,3200);}
function announceSave(message){notify(saveEvents()?message:'변경했지만 브라우저에 저장하지 못했습니다. 상단 안내를 확인해 주세요.');}
function sorted(items){return [...items].sort((a,b)=>a.date.localeCompare(b.date)||priorities.indexOf(a.priority)-priorities.indexOf(b.priority)||a.title.localeCompare(b.title,'ko'));}
function card(event){const id=escapeHTML(event.id),name=escapeHTML(event.title);return '<article class="event '+(event.priority==='높음'?'high ':'')+(event.done?'done':'')+'"><div class="badges"><span class="badge '+(event.priority==='높음'?'urgent':'')+'">'+(event.priority==='높음'?'! 중요도 높음':event.priority)+'</span><span class="badge dday">'+dday(event)+'</span></div><h3 class="event-title">'+name+'</h3><div class="event-date">'+formatDate(event.date,true)+(event.endDate!==event.date?' ~ '+formatDate(event.endDate,true):'')+'</div><div class="badge" style="display:inline-block;margin-top:8px">'+escapeHTML(event.category)+'</div>'+(event.memo?'<p class="memo">'+escapeHTML(event.memo)+'</p>':'')+'<div class="event-actions"><label class="check-label"><input type="checkbox" data-complete="'+id+'" '+(event.done?'checked':'')+' aria-label="'+name+' 완료"><span>'+(event.done?'완료':'완료 체크')+'</span></label><button type="button" data-edit="'+id+'" aria-label="'+name+' 수정">수정</button><button type="button" class="delete" data-delete="'+id+'" aria-label="'+name+' 삭제">삭제</button></div></article>';}
function render(){const today=todayKey();$('todayDate').textContent=formatDate(today,true);const todays=events.filter(e=>e.date<=today&&e.endDate>=today);$('summary').innerHTML='<span>오늘 일정 <b>'+todays.length+'</b></span><span>오늘 미완료 <b>'+todays.filter(e=>!e.done).length+'</b></span><span>전체 일정 <b>'+events.length+'</b></span>';
document.querySelectorAll('[data-tab]').forEach(button=>{const selected=button.dataset.tab===activeTab;button.setAttribute('aria-selected',String(selected));button.tabIndex=selected?0:-1;});$('view').setAttribute('aria-labelledby','tab-'+activeTab);$('weekControls').hidden=activeTab!=='week';$('viewTitle').textContent=({today:'오늘 일정',week:'이번 주 일정',past:'지난 일정',all:'전체 일정'})[activeTab];
if(activeTab==='week'){const end=addDays(weekStart,6);$('weekRange').textContent=formatDate(weekStart,true)+' — '+formatDate(end,true);$('view').className='week-grid';$('view').innerHTML=Array.from({length:7},(_,i)=>{const day=addDays(weekStart,i),items=sorted(events.filter(e=>e.date<=day&&e.endDate>=day));return '<section class="day-column '+(day===today?'is-today ':'')+(i>=5?'weekend':'')+'" aria-label="'+formatDate(day,true)+'"><h3 class="day-title">'+weekdays[parseDate(day).getDay()]+'요일 <small>'+formatDate(day)+(day===today?' · 오늘':'')+'</small></h3>'+(items.length?items.map(card).join(''):'<p class="day-empty">일정 없음</p>')+'</section>';}).join('');}
else{let items=sorted(events.filter(e=>activeTab==='today'?e.date<=today&&e.endDate>=today:activeTab==='past'?e.endDate<today:true));if(activeTab==='past')items.sort((a,b)=>b.endDate.localeCompare(a.endDate)||a.date.localeCompare(b.date));$('view').className='list';$('view').innerHTML=items.length?items.map(card).join(''):'<div class="empty">'+(activeTab==='today'?'오늘 등록된 일정이 없습니다.':activeTab==='past'?'지난 일정이 없습니다.':'등록된 일정이 없습니다.')+'<br>일정 입력에서 새 일정을 추가해 보세요.</div>';}}
function resetForm(){editingId=null;$('eventForm').reset();$('date').value=todayKey();$('endDate').min=$('date').value;$('formTitle').textContent='새 일정 입력';$('saveButton').textContent='일정 저장';$('cancelEdit').hidden=true;$('endDate').setCustomValidity('');}
function checkEnd(){const invalid=$('endDate').value&&$('endDate').value<$('date').value;$('endDate').setCustomValidity(invalid?'종료일은 시작일보다 빠를 수 없습니다.':'');return !invalid;}
$('date').addEventListener('change',()=>{$('endDate').min=$('date').value;checkEnd();});$('endDate').addEventListener('input',checkEnd);
$('eventForm').addEventListener('submit',event=>{event.preventDefault();if(!checkEnd()||!$('eventForm').reportValidity())return;const title=$('title').value.trim();if(!title){$('title').setCustomValidity('제목을 입력해 주세요.');$('title').reportValidity();return;}const old=events.find(e=>e.id===editingId);const item={id:editingId||('event-'+Date.now()+'-'+Math.random().toString(36).slice(2)),title,date:$('date').value,endDate:$('endDate').value||$('date').value,category:$('category').value,priority:$('priority').value,memo:$('memo').value.trim(),done:old?old.done:false};if(old)events=events.map(e=>e.id===editingId?item:e);else events.push(item);const message=old?'일정을 수정했습니다.':'일정을 저장했습니다.';weekStart=monday(item.date);activeTab='week';resetForm();render();announceSave(message);});
$('title').addEventListener('input',()=>$('title').setCustomValidity(''));
document.querySelectorAll('[data-tab]').forEach(button=>button.addEventListener('click',()=>{activeTab=button.dataset.tab;render();}));
document.querySelector('.tabs').addEventListener('keydown',event=>{const buttons=[...document.querySelectorAll('[data-tab]')];let index=buttons.indexOf(document.activeElement);if(index<0)return;if(event.key==='ArrowRight')index=(index+1)%4;else if(event.key==='ArrowLeft')index=(index+3)%4;else if(event.key==='Home')index=0;else if(event.key==='End')index=3;else return;event.preventDefault();buttons[index].click();buttons[index].focus();});
$('prevWeek').addEventListener('click',()=>{weekStart=addDays(weekStart,-7);render();});$('nextWeek').addEventListener('click',()=>{weekStart=addDays(weekStart,7);render();});$('thisWeek').addEventListener('click',()=>{weekStart=monday(todayKey());render();});
$('view').addEventListener('change',event=>{const id=event.target.dataset.complete;if(!id)return;const checked=event.target.checked;events=events.map(e=>e.id===id?{...e,done:event.target.checked}:e);render();const replacement=[...document.querySelectorAll('[data-complete]')].find(el=>el.dataset.complete===id);if(replacement)replacement.focus();announceSave(checked?'완료로 표시했습니다.':'완료 체크를 해제했습니다.');});
$('view').addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;const editId=button.dataset.edit,deleteId=button.dataset.delete;if(editId){const item=events.find(e=>e.id===editId);if(!item)return;editingId=item.id;for(const field of ['title','date','category','priority','memo'])$(field).value=item[field];$('endDate').value=item.endDate===item.date?'':item.endDate;$('endDate').min=item.date;$('title').setCustomValidity('');checkEnd();$('formTitle').textContent='일정 수정';$('saveButton').textContent='수정 저장';$('cancelEdit').hidden=false;$('editor').scrollIntoView({behavior:'smooth',block:'start'});$('title').focus({preventScroll:true});}if(deleteId){pendingDelete=deleteId;deleteOpener=button;$('deleteName').textContent=events.find(e=>e.id===deleteId).title;$('deleteDialog').showModal();$('cancelDelete').focus();}});
$('cancelDelete').addEventListener('click',()=>$('deleteDialog').close());$('deleteDialog').addEventListener('close',()=>{pendingDelete=null;if(deleteOpener&&deleteOpener.isConnected)deleteOpener.focus();});$('confirmDelete').addEventListener('click',()=>{const id=pendingDelete;if(!id)return;events=events.filter(e=>e.id!==id);if(editingId===id)resetForm();$('deleteDialog').close();render();announceSave('일정을 삭제했습니다.');});
$('cancelEdit').addEventListener('click',resetForm);$('jumpAdd').addEventListener('click',()=>{$('editor').scrollIntoView({behavior:'smooth',block:'start'});$('title').focus({preventScroll:true});});
let lastToday=todayKey();setInterval(()=>{const current=todayKey();if(current!==lastToday){if(weekStart===monday(lastToday))weekStart=monday(current);lastToday=current;render();}},30000);
window.addEventListener('storage',event=>{if(event.key===STORAGE_KEY&&!editingId){try{const data=JSON.parse(event.newValue);if(Array.isArray(data)&&data.every(validEvent)){events=data;render();notify('다른 창의 변경 내용을 반영했습니다.');}}catch(error){/* Keep current data when another window writes invalid data. */}}});
resetForm();render();
</script>
</body>
</html>
